name: Validate and deploy AstroLab
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: astrolab-pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test, typecheck, build and inspect static links
        run: npm run check
        env:
          NEXT_PUBLIC_BASE_PATH: /AstroLab
      - uses: actions/upload-artifact@v4
        with:
          name: astrolab-tested-export
          path: ./out
          if-no-files-found: error
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: astrolab-tested-export
          path: ./out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4
